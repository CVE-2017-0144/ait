name: Bug Report
description: File a bug report.
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      Only bugs of the NeoForge port go here. If it happens on Fabric too, report it to [upstream](https://github.com/amblelabs/ait/issues).
- type: textarea
  id: what-happened
  attributes:
    label: What happened?
    description: Also tell us, what did you expect to happen?
    placeholder: Tell us what you see!
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    value: |
      1. Go to '...'
      2. Click on '....'
      3. Place down '...'
      4. See error
  validations:
    required: true
- type: input
  id: exterior
  attributes:
    label: Exterior
    description: For door, portal or rendering bugs, the exterior and its variant.
    placeholder: "Police Box, Renaissance"
- type: input
  id: interior
  attributes:
    label: Interior
    description: The desktop the TARDIS has, same kind of bugs.
    placeholder: "Alnico"
- type: input
  id: version
  attributes:
    label: Version
    description: Jar name or the commit you built.
    placeholder: "ait-1.3.0-dev.1+mc.1.21.1.jar"
  validations:
    required: true
- type: input
  id: neoforge
  attributes:
    label: NeoForge version
    placeholder: "21.1.249"
  validations:
    required: true
- type: checkboxes
  id: mods
  attributes:
    label: Also installed
    options:
      - label: Immersive Portals
      - label: Sodium
      - label: Iris
- type: textarea
  attributes:
    label: Logs & screenshots
    description: |
      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
- type: checkboxes
  attributes:
    label: I've checked the reported issues...
    options:
      - label: |
          ...and this issue was not reported before.
        required: true
