name: neoforge

on:
  push:
    branches: [neoforge]
    tags: ['v*']
  pull_request:
    branches: [neoforge]
  workflow_dispatch:

concurrency:
  group: neoforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew runData

      - run: ./gradlew build

      - run: python3 tools/sync/test_sync.py

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ait
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 1

      - name: server
        run: |
          mkdir -p run/server
          echo eula=true > run/server/eula.txt
          echo 'allprojects { tasks.withType(JavaExec).configureEach { if (name == "runServer") standardInput = System.in } }' > /tmp/stdin.gradle
          mkfifo /tmp/in
          ./gradlew runServer -I /tmp/stdin.gradle < /tmp/in > server.log 2>&1 &
          pid=$!
          exec 3> /tmp/in
          for i in $(seq 300); do
            grep -q 'Done (' server.log && break
            kill -0 $pid 2>/dev/null || break
            sleep 2
          done
          grep -q 'Done (' server.log || { tail -n 200 server.log; exit 1; }
          kill -0 $pid 2>/dev/null || { tail -n 200 server.log; exit 1; }
          echo stop >&3
          wait $pid || { tail -n 200 server.log; exit 1; }
          grep -E 'Done \(|Stopping server' server.log

  label:
    needs: build
    if: (success() || failure()) && github.event_name == 'pull_request' && startsWith(github.head_ref, 'sync/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          RESULT: ${{ needs.build.result }}
        run: |
          if [ "$RESULT" = success ]; then
            gh pr edit "$PR" --remove-label 'broken build' || true
          else
            gh pr edit "$PR" --add-label 'broken build'
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ait
          path: dist

      - run: |
          jar=$(ls dist/*.jar)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          else
            git fetch -q --force --tags origin
            python3 tools/notes.py "$GITHUB_REF_NAME" > notes.md
            case "$GITHUB_REF_NAME" in
              *dev*) how=--draft ;;
              *-*) how=--prerelease ;;
              *) how= ;;
            esac
            gh release create "$GITHUB_REF_NAME" "$jar" --title "$GITHUB_REF_NAME" --notes-file notes.md $how
          fi

      - if: always()
        run: gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[].id' | while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"; done
