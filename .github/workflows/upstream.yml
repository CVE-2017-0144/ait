name: upstream

on:
  schedule:
    - cron: '41 */4 * * *'
  workflow_dispatch:

concurrency: upstream

jobs:
  sync:
    if: github.repository == 'CVE-2017-0144/ait'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: only ours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json id,path,state -q '.[] | select(.state == "active") | "\(.id) \(.path)"' | while read -r id path; do
            case "$path" in
              .github/workflows/upstream.yml|.github/workflows/neoforge.yml) ;;
              *) gh workflow disable "$id" || true ;;
            esac
          done

      - uses: actions/checkout@v7
        with:
          ref: neoforge
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: mirror
        id: up
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git fetch -q --no-tags https://github.com/amblelabs/ait.git main
          git push -q origin FETCH_HEAD:refs/heads/main
          from=$(cat tools/sync/upstream)
          to=$(git rev-parse FETCH_HEAD)
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          python3 tools/sync/pr.py "$from" "$to" --check >> "$GITHUB_OUTPUT"

      - if: steps.up.outputs.run == '1'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - if: steps.up.outputs.run == '1'
        uses: gradle/actions/setup-gradle@v6

      - if: steps.up.outputs.run == '1'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FROM: ${{ steps.up.outputs.from }}
          TO: ${{ steps.up.outputs.to }}
        run: python3 tools/sync/pr.py "$FROM" "$TO"
