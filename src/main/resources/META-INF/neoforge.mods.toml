 - panda_red (classic_account)
 - Ouroboros
 - Maggie
 - Monsterwaill
 - Westankrang
 - Dian

Music:
 - RatZoomie
 - lucien"""
credits = """
Contributors:
 - vmbbi (Max)
 - Echo
 - Tryzo (Ben)
 - nitrogenez
 - DocArcane (Designed the original steam console)
 - Bug1312
 - Jayson
 - Creativious
 - TARDIS SFX for some TARDIS Sounds
 - Pastelb96 (translations)
 - Codiak
 - Small Moss (translations)
 - bastalation
 - Hailrake"""
description = """
Adventures In Time - Apparatus Vivi. Living machine. TARDIS from Doctor Who. Whatever you call it, it grows with you. It learns with you, and flies the way you fly. Sure, you might be the pilot, but despite that, it does with that what it may."""

[modproperties.ait]
"yumi:entrypoints" = { "lambdynlights:initializer" = "dev.amble.ait.compat.lambdynlights.LambDynLightsCompat" }

# libs before ait, it expects their registries and schedulers up
[[mixins]]
config = "queue.mixins.json"

[[mixins]]
config = "multidim.mixins.json"

[[mixins]]
config = "amblekit.mixins.json"

[[mixins]]
config = "ait.mixins.json"

[[mixins]]
config = "gaslighter.mixins.json"

[[mixins]]
config = "planet.mixins.json"

[[mixins]]
config = "gun.mixins.json"

[[dependencies.ait]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ait]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ait]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[3.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ait]]
modId = "immersive_portals_core"
type = "optional"
versionRange = "[6.0.7,6.1)"
ordering = "NONE"
side = "BOTH"
