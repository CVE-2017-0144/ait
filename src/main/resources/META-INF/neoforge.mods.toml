[[mods]]
modId = "ait"
version = "${version}"
displayName = "Adventures In Time"
logoFile = "assets/ait/icon.png"
displayURL = "https://amblelabs.github.io"
authors = """
Amble Labs:
Developers:
 - Loqor
 - DrTheo
 - Duzo
